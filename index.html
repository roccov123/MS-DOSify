<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>MS-DOS Spotify Executive v1.01</title>
  <style>
    :root {
      --win-bg: #000000;
      --win-fg: #ffffff;
      --win-blue: #0000aa;
      --win-border: 2px solid #ffffff;
    }

    * {
      box-sizing: border-box;
      font-family: "Courier New", Courier, monospace;
      user-select: none;
    }

    body {
      background-color: var(--win-bg);
      color: var(--win-fg);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .window {
      width: 720px;
      border: var(--win-border);
      background: var(--win-bg);
      box-shadow: 8px 8px 0px #333333;
    }

    .title-bar {
      background: var(--win-fg);
      color: var(--win-bg);
      padding: 4px 8px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: var(--win-border);
    }

    .menu-bar {
      border-bottom: var(--win-border);
      padding: 4px;
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .btn-retro {
      background: var(--win-bg);
      color: var(--win-fg);
      border: var(--win-border);
      padding: 4px 10px;
      cursor: pointer;
      font-weight: bold;
      text-transform: uppercase;
    }

    .btn-retro:hover {
      background: var(--win-fg);
      color: var(--win-bg);
    }

    .btn-retro:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .content {
      padding: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .panel {
      border: var(--win-border);
      padding: 8px;
      height: 320px;
      display: flex;
      flex-direction: column;
    }

    .panel-title {
      border-bottom: 1px dashed #fff;
      padding-bottom: 4px;
      margin-bottom: 8px;
      font-size: 14px;
      text-transform: uppercase;
    }

    .track-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .track-item {
      padding: 4px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 12px;
    }

    .track-item:hover, .track-item.active {
      background: var(--win-fg);
      color: var(--win-bg);
    }

    .status-box {
      font-size: 12px;
      margin-top: 8px;
      line-height: 1.4;
    }

    .controls {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="window">
  <div class="title-bar">
    <span>A:\SPOTIFY.EXE - Windows 1.0 Audio Manager</span>
    <span>[-] [=] [X]</span>
  </div>

  <div class="menu-bar">
    <button class="btn-retro" id="syncBtn">Sync Playlists</button>
    <span id="syncStatus" style="font-size: 11px;">Status: Not Synced</span>
  </div>

  <div class="content">
    <div class="panel">
      <div class="panel-title">Playlists</div>
      <ul class="track-list" id="trackList">
        <li class="track-item">-- Click Sync Playlists to Load --</li>
      </ul>
    </div>

    <div class="panel">
      <div class="panel-title">Now Playing</div>
      <div class="status-box">
        <p><strong>Track:</strong> <span id="nowTrack">None</span></p>
        <p><strong>Artist:</strong> <span id="nowArtist">None</span></p>
        <p><strong>Album:</strong> <span id="nowAlbum">None</span></p>
        <p><strong>Device:</strong> <span id="deviceName">Initializing...</span></p>
      </div>

      <div class="controls">
        <button class="btn-retro" id="prevBtn" disabled>&lt;&lt;</button>
        <button class="btn-retro" id="playBtn" disabled>PLAY/PAUSE</button>
        <button class="btn-retro" id="nextBtn" disabled>&gt;&gt;</button>
      </div>
    </div>
  </div>
</div>

<script src="https://sdk.scdn.co/spotify-player.js"></script>
<script>
  let accessToken = null;
  let player = null;
  let deviceId = null;
  let tokenExpiresAt = 0;

  const syncBtn = document.getElementById('syncBtn');
  const trackList = document.getElementById('trackList');
  const syncStatus = document.getElementById('syncStatus');

  // Ask our own server for a fresh access token.
  // The server holds the Client ID/Secret/Refresh Token — this page
  // never sees them and never talks to Spotify's login page.
  async function getAccessToken() {
    // Reuse the current token if it's still valid for a bit longer.
    if (accessToken && Date.now() < tokenExpiresAt - 30000) {
      return accessToken;
    }

    const res = await fetch('/api/refresh-token');
    const data = await res.json();

    if (data.error) {
      throw new Error(data.error);
    }

    accessToken = data.access_token;
    tokenExpiresAt = Date.now() + data.expires_in * 1000;

    // First time we get a token, spin up the player if it isn't already.
    if (!player) {
      initPlayer();
    }

    return accessToken;
  }

  // Pulls ALL playlists, following pagination (a user can have more than
  // the 50-per-request max, so we keep requesting "next" until it's null).
  async function fetchAllPlaylists(token) {
    let playlists = [];
    let url = 'https://api.spotify.com/v1/me/playlists?limit=50';

    while (url) {
      const res = await fetch(url, {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (!res.ok) {
        throw new Error(`Spotify API error: ${res.status}`);
      }

      const data = await res.json();
      playlists = playlists.concat(data.items);
      url = data.next; // Spotify gives us the next page URL directly, or null when done.
    }

    return playlists;
  }

  async function fetchLibrary() {
    syncStatus.innerText = "Status: Syncing...";
    syncBtn.disabled = true;

    try {
      const token = await getAccessToken();
      const playlists = await fetchAllPlaylists(token);

      trackList.innerHTML = '';
      playlists.forEach(playlist => {
        const li = document.createElement('li');
        li.className = 'track-item';
        li.innerText = `> ${playlist.name} (${playlist.tracks.total} tracks)`;
        li.onclick = () => playPlaylist(playlist.uri, li);
        trackList.appendChild(li);
      });

      syncStatus.innerText = `Status: Synced (${playlists.length} Playlists)`;
    } catch (err) {
      syncStatus.innerText = "Status: Sync Failed";
      console.error(err);
    } finally {
      syncBtn.disabled = false;
    }
  }

  syncBtn.addEventListener('click', fetchLibrary);

  window.onSpotifyWebPlaybackSDKReady = () => {
    // Player initializes lazily on first getAccessToken() call
    // (triggered by clicking Sync), since it needs a token to connect.
  };

  function initPlayer() {
    player = new Spotify.Player({
      name: 'Windows 1.0 Retro Player',
      getOAuthToken: async cb => {
        const token = await getAccessToken();
        cb(token);
      },
      volume: 0.8
    });

    player.addListener('ready', ({ device_id }) => {
      deviceId = device_id;
      document.getElementById('deviceName').innerText = 'Win 1.0 Virtual Soundcard';
      document.getElementById('playBtn').disabled = false;
      document.getElementById('prevBtn').disabled = false;
      document.getElementById('nextBtn').disabled = false;
    });

    player.addListener('player_state_changed', state => {
      if (!state) return;
      document.getElementById('nowTrack').innerText = state.track_window.current_track.name;
      document.getElementById('nowArtist').innerText = state.track_window.current_track.artists[0].name;
      document.getElementById('nowAlbum').innerText = state.track_window.current_track.album.name;
    });

    player.connect();

    document.getElementById('playBtn').onclick = () => player.togglePlay();
    document.getElementById('nextBtn').onclick = () => player.nextTrack();
    document.getElementById('prevBtn').onclick = () => player.previousTrack();
  }

  // Plays an entire playlist as a queue, starting from track 1.
  // Spotify distinguishes "context_uri" (a playlist/album to play through)
  // from "uris" (a specific list of individual tracks) — we want the former.
  async function playPlaylist(contextUri, clickedEl) {
    if (!deviceId) return;

    document.querySelectorAll('.track-item.active').forEach(el => el.classList.remove('active'));
    if (clickedEl) clickedEl.classList.add('active');

    const token = await getAccessToken();
    const res = await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
      method: 'PUT',
      body: JSON.stringify({ context_uri: contextUri }),
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`
      },
    });

    if (!res.ok && res.status !== 204) {
      console.error('Playback failed:', res.status, await res.text());
    }
  }
</script>
</body>
</html>
